services:
  postgres:
    image: postgres:15-alpine
    container_name: job_market_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_market_pass}
      POSTGRES_DB: ${POSTGRES_DB:-job_market_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_market_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job_market_network

  redis:
    image: redis:7-alpine
    container_name: job_market_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job_market_network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: job_market_api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_market_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  job_market_network:
    driver: bridge
