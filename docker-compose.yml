services:
  postgres:
    image: postgres:15-alpine
    container_name: job_market_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_market_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_market_pass}
      POSTGRES_DB: ${POSTGRES_DB:-job_market_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-job_market_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job_market_network

  redis:
    image: redis:7-alpine
    container_name: job_market_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - job_market_network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: job_market_api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_market_network
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.9.1
    container_name: job_market_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-zDmVnGEzUVwquJRYkBOC7VIL8LVPUQ8VJR1RPKGPgWM=}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./src:/opt/airflow/app/src
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_market_network
    entrypoint: >
      /bin/bash -c "
      pip install fastapi sqlalchemy asyncpg alembic pydantic pydantic-settings redis python-jose bcrypt httpx feedparser &&
      airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true)
      "

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: job_market_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-zDmVnGEzUVwquJRYkBOC7VIL8LVPUQ8VJR1RPKGPgWM=}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./src:/opt/airflow/app/src
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - job_market_network
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: job_market_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-zDmVnGEzUVwquJRYkBOC7VIL8LVPUQ8VJR1RPKGPgWM=}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-job_market_user}:${POSTGRES_PASSWORD:-job_market_pass}@postgres:5432/${POSTGRES_DB:-job_market_db}
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./src:/opt/airflow/app/src
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - job_market_network
    command: scheduler
    restart: unless-stopped

  superset:
      image: apache/superset:3.1.0
      container_name: job_market_superset
      environment:
        SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-superset-secret-key-change-in-production}
        SUPERSET_LOAD_EXAMPLES: "no"
      ports:
        - "8088:8088"
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - job_market_network
      command: >
        /bin/bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@example.com --password admin || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
        "
      restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  airflow_logs:

networks:
  job_market_network:
    driver: bridge
