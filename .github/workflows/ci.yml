# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Ruff lint
        run: poetry run ruff check .

      - name: Run Ruff format check
        run: poetry run ruff format --check .

      - name: Run MyPy
        run: poetry run mypy src/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: job_market_user
          POSTGRES_PASSWORD: job_market_pass
          POSTGRES_DB: job_market_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Create test database
        run: |
          PGPASSWORD=job_market_pass psql -h localhost -U job_market_user -d job_market_db -c "CREATE DATABASE test_job_market_db;"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://job_market_user:job_market_pass@localhost:5432/job_market_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-minimum-32-chars
          POSTGRES_USER: job_market_user
          POSTGRES_PASSWORD: job_market_pass
          POSTGRES_DB: job_market_db
          REDIS_URL: redis://localhost:6379/0
        run: poetry run alembic upgrade head

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://job_market_user:job_market_pass@localhost:5432/job_market_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-minimum-32-chars
          POSTGRES_USER: job_market_user
          POSTGRES_PASSWORD: job_market_pass
          POSTGRES_DB: job_market_db
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://job_market_user:job_market_pass@localhost:5432/job_market_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-minimum-32-chars
          POSTGRES_USER: job_market_user
          POSTGRES_PASSWORD: job_market_pass
          POSTGRES_DB: job_market_db
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest tests/integration/ -v --tb=short

      - name: Run coverage
        env:
          DATABASE_URL: postgresql+asyncpg://job_market_user:job_market_pass@localhost:5432/job_market_db
          SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-minimum-32-chars
          POSTGRES_USER: job_market_user
          POSTGRES_PASSWORD: job_market_pass
          POSTGRES_DB: job_market_db
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=50
